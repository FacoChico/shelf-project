spring:
  application:
    name: shelf-project
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: '${DB_URL:jdbc:h2:file:./data/shelf;DB_CLOSE_ON_EXIT=FALSE}'
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  thymeleaf:
    cache: true
server:
  address: ${APP_BIND_ADDRESS:127.0.0.1}
  port: ${APP_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: SHELF_SESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
app:
  auth:
    issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/shelf}
    client-id: shelf-web
    client-secret: ${OIDC_CLIENT_SECRET}
    post-logout-redirect-uri: ${APP_BASE_URL:http://localhost:8080}/
