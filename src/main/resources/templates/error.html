<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Не удалось открыть страницу')}"></head>
<body class="landing">
<header class="landing-header">
    <div th:replace="~{fragments/layout :: brand}"></div>
</header>
<main class="error-main"><span class="error-code" th:text="${code}">404</span>
    <h1 th:text="${heading}">На этой полке пусто</h1>
    <p th:text="${explanation}">Доступен переход на главную страницу.</p><a class="button" th:href="@{/}">На главную
        <svg th:replace="~{fragments/icons :: icon('arrow')}"></svg>
    </a></main>
</body>
</html>
