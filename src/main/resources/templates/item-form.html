<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${editing ? 'Редактирование записи' : 'Новая запись'})}"></head>
<body><a class="skip-link" href="#main">К содержимому</a>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <main id="main" class="workspace"><a class="back-link" th:href="@{/shelf}">← Полка</a>
        <header class="page-heading form-heading">
            <div><span class="eyebrow">МЕСТО ДЛЯ НОВОЙ ИСТОРИИ</span>
                <h1 th:text="${editing ? 'Редактирование записи' : 'Новая запись'}">Новая запись</h1>
                <p th:text="${editing ? 'Редактирование статуса и заметки.' : 'Название, категория, статус и заметка.'}"></p>
            </div>
        </header>
        <div class="form-layout">
            <section class="form-panel">
                <form th:action="${editing} ? @{/items/{id}(id=${itemId})} : @{/items}" th:object="${item}"
                      method="post" class="item-form">
                    <div class="alert alert-error" role="alert" th:if="${#fields.hasAnyErrors()}">В форме обнаружены ошибки. Запись не сохранена.
                    </div>
                    <div class="field"><label for="title">Название <span class="required-mark">*</span></label><input
                            id="title" th:field="*{title}" maxlength="160" required
                            placeholder="Например, «Понедельник начинается в субботу»"
                            th:attr="aria-invalid=${#fields.hasErrors('title')},aria-describedby=${#fields.hasErrors('title') ? 'title-error' : null}">
                        <p id="title-error" class="field-error" th:if="${#fields.hasErrors('title')}"
                           th:errors="*{title}"></p></div>
                    <div class="field-row">
                        <div class="field"><label for="category">Категория</label><select id="category"
                                                                                         th:field="*{category}"
                                                                                         required>
                            <option th:each="c : ${categories}" th:value="${c}"
                                    th:text="${@viewLabels.category(c)}"></option>
                        </select>
                            <p class="field-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></p>
                        </div>
                        <div class="field"><label for="status">Статус</label><select id="status"
                                                                                              th:field="*{status}"
                                                                                              required>
                            <option th:each="s : ${statuses}" th:value="${s}"
                                    th:text="${@viewLabels.status(s)}"></option>
                        </select>
                            <p class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></p>
                        </div>
                    </div>
                    <div class="field"><label for="note">Заметка <span
                            class="optional">необязательно</span></label><textarea id="note" th:field="*{note}" rows="6"
                                                                                   maxlength="2000"
                                                                                   placeholder="Кто посоветовал? Что зацепило? Или что осталось после финала…"
                                                                                   aria-describedby="note-hint"></textarea>
                        <div class="field-caption"><span id="note-hint">Личная заметка. До 2 000 символов.</span><span
                                id="note-counter" aria-hidden="true"></span></div>
                        <p class="field-error" th:if="${#fields.hasErrors('note')}" th:errors="*{note}"></p></div>
                    <div class="form-actions">
                        <button class="button" type="submit"
                                th:text="${editing ? 'Сохранить изменения' : 'Добавить на полку'}">Добавить на полку
                        </button>
                        <a class="button button-quiet" th:href="@{/shelf}">Отмена</a></div>
                </form>
            </section>
            <aside class="form-aside"><span class="small-star" aria-hidden="true">✳</span>
                <h2>Записи<br>коллекции.</h2>
                <p>Коллекция предназначена для хранения рекомендаций и личных планов.</p>
                <p>Статус и заметку можно изменить в любое время.</p>
                <form th:if="${editing}" th:action="@{/items/{id}/delete(id=${itemId})}" method="post"
                      data-confirm="Удалить запись с полки? Восстановить её не получится.">
                    <button type="submit" class="delete-button">Удалить запись</button>
                </form>
            </aside>
        </div>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </main>
</div>
</body>
</html>
